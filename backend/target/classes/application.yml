server:
  port: 8080

spring:
  application:
    name: task-management

  # Mặc định kết nối MariaDB (Chuẩn SRS)
  # Nếu chạy thử khi chưa cài MariaDB, dùng: --spring.profiles.active=dev
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/task_mgmt?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    # Secret key tối thiểu 32 ký tự (256-bit) cho thuật toán HMAC-SHA256
    secret: ${JWT_SECRET:TaskMgmtSuperSecretKeyForJwtSigning2026MentorDemo!}
    expiration-ms: 3600000 # 1 giờ (3600 giây)
  cors:
    allowed-origins: http://localhost:4200

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs
