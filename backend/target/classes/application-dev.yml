# Profile "dev": dùng H2 giả lập chế độ MariaDB/MySQL để chạy ngay khi máy chưa bật MariaDB
spring:
  datasource:
    url: jdbc:h2:mem:task_mgmt;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
